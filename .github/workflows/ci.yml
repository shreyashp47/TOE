name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one run per branch; a new push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Proves the "professional" claim rather than asserting it: deliberately break
  # a money rule and confirm the suite catches it.
  self-check:
    name: tests actually fail on a broken rule
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Introduce a deliberate bug
        run: |
          sed -i 's/return lines.reduce((sum, line) => sum + lineSubtotal(line), 0);/return lines.reduce((sum, line) => sum + line.qty, 0);/' src/lib/money.ts
          git diff --stat

      - name: The suite must go red
        run: |
          if npm test -- --run src/lib/__tests__/money.test.ts; then
            echo "::error::money tests passed against a broken implementation"
            exit 1
          fi
          echo "money tests correctly failed"

  visual:
    name: mobile layout smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check every screen at phone widths
        run: node scripts/screenshot.mjs
        env:
          NEXT_PUBLIC_CAFE_NAME: Mochi & Beans

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .screenshots/
          retention-days: 14
